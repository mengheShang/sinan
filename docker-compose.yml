# One command to start everything: docker compose up --build
# Runs in demo mode without a .env file; to change settings, copy .env.example to .env.
# All ports bind to 127.0.0.1 only, so other devices on the network cannot reach them.

name: sinan

# No fixed `image:` names. Compose names images after the project (sinan-api,
# sinan-web, ...), so a branch or demo started with `-p <other>` builds its own
# images and cannot replace the ones the live stack runs.
x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
    args:
      # Names the image's commit in evaluation reports; `unknown` when unset
      SINAN_COMMIT: ${SINAN_COMMIT:-unknown}
  restart: unless-stopped
  environment:
    SINAN_MODE: ${SINAN_MODE:-demo}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sinan}:${POSTGRES_PASSWORD:-sinan}@db:5432/${POSTGRES_DB:-sinan}
    # Empty in demo mode; live mode refuses to start without a valid key
    SINAN_ENCRYPTION_KEY: ${SINAN_ENCRYPTION_KEY:-}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sinan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sinan}
      POSTGRES_DB: ${POSTGRES_DB:-sinan}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    # Create the database if needed (demo mode uses <name>_demo), migrate, then start
    command: sh -c "python -m app.db.ensure && alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    environment:
      SINAN_MODE: ${SINAN_MODE:-demo}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sinan}:${POSTGRES_PASSWORD:-sinan}@db:5432/${POSTGRES_DB:-sinan}
      SINAN_ENCRYPTION_KEY: ${SINAN_ENCRYPTION_KEY:-}
      # Dashboard login. Only the API gets these; empty means the demo login in demo mode
      SINAN_DASHBOARD_USERNAME: ${SINAN_DASHBOARD_USERNAME:-}
      SINAN_DASHBOARD_PASSWORD_HASH: ${SINAN_DASHBOARD_PASSWORD_HASH:-}
      SINAN_SESSION_SECRET: ${SINAN_SESSION_SECRET:-}
      # Read-only Gmail OAuth client. The API connects accounts; the Worker refreshes
      # read tokens with it. Demo mode uses a fake
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Zone the Dashboard shows digest times in
      SINAN_TIMEZONE: ${SINAN_TIMEZONE:-America/Los_Angeles}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    # Read-only token: sync, prefilter, extraction, daily digest
    command: python -m apps.worker.main
    environment:
      SINAN_MODE: ${SINAN_MODE:-demo}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sinan}:${POSTGRES_PASSWORD:-sinan}@db:5432/${POSTGRES_DB:-sinan}
      SINAN_ENCRYPTION_KEY: ${SINAN_ENCRYPTION_KEY:-}
      SINAN_SYNC_INTERVAL_MINUTES: ${SINAN_SYNC_INTERVAL_MINUTES:-15}
      # Needed to trade the stored read refresh token for an access token
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Extraction; without a key, live mode syncs but extracts nothing
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SINAN_LLM_MODEL: ${SINAN_LLM_MODEL:-claude-haiku-5-5}
      SINAN_EXTRACT_PER_CYCLE: ${SINAN_EXTRACT_PER_CYCLE:-100}
      # The daily digest: its local day and the hour after which it is made
      SINAN_TIMEZONE: ${SINAN_TIMEZONE:-America/Los_Angeles}
      SINAN_DIGEST_HOUR: ${SINAN_DIGEST_HOUR:-7}
      # Sets the expiry time of the proposals it makes (ADR 0009, decision 6)
      SINAN_PROPOSAL_TTL_DAYS: ${SINAN_PROPOSAL_TTL_DAYS:-7}
    # Local prefilter rules (git-ignored); the example rules apply when absent
    volumes:
      - ./config:/srv/config:ro
    # Start after the API has created and migrated the database
    depends_on:
      api:
        condition: service_healthy

  executor:
    <<: *backend
    # The only service that holds the write token
    command: python -m apps.executor.main

  web:
    build:
      context: apps/web
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:

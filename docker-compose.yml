# One command to start everything: docker compose up --build
# Runs in demo mode without a .env file; to change settings, copy .env.example to .env.
# All ports bind to 127.0.0.1 only, so other devices on the network cannot reach them.

name: sinan

x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  image: sinan-backend:dev
  restart: unless-stopped
  environment:
    SINAN_MODE: ${SINAN_MODE:-demo}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sinan}:${POSTGRES_PASSWORD:-sinan}@db:5432/${POSTGRES_DB:-sinan}
    # Empty in demo mode; live mode refuses to start without a valid key
    SINAN_ENCRYPTION_KEY: ${SINAN_ENCRYPTION_KEY:-}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sinan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sinan}
      POSTGRES_DB: ${POSTGRES_DB:-sinan}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    # Run database migrations before starting
    command: sh -c "alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    environment:
      SINAN_MODE: ${SINAN_MODE:-demo}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sinan}:${POSTGRES_PASSWORD:-sinan}@db:5432/${POSTGRES_DB:-sinan}
      SINAN_ENCRYPTION_KEY: ${SINAN_ENCRYPTION_KEY:-}
      # Dashboard login. Only the API gets these; empty means the demo password in demo mode
      SINAN_DASHBOARD_PASSWORD_HASH: ${SINAN_DASHBOARD_PASSWORD_HASH:-}
      SINAN_SESSION_SECRET: ${SINAN_SESSION_SECRET:-}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    # Read-only token: sync, prefilter, extraction, daily digest
    command: python -m apps.worker.main

  executor:
    <<: *backend
    # The only service that holds the write token
    command: python -m apps.executor.main

  web:
    build:
      context: apps/web
    image: sinan-web:dev
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:

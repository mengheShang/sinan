# Example prefilter rules. Every sender and domain here is fictional.
#
# Put your real rules in config/prefilter.toml, which git ignores. Copy this
# file there and edit it. Never commit real addresses (CLAUDE.md, rule 2).
#
# Order (ADR 0006):
#   1. [school] sensitive_keywords skip school mail, even if allowed.
#   2. [allow] passes.
#   3. [skip] skips.
#   4. Bulk headers (List-Unsubscribe, Precedence: bulk) skip.
#   5. Everything else passes.
#
# [trust] (at the end) does not change what passes; it decides which items
# may stay open (ADR 0010).
#
# Senders are full addresses. A domain also covers its subdomains, so
# "example.edu" matches "mail.example.edu". Keywords match whole words or
# phrases in the subject, ignoring case.

[allow]
senders = ["prof.rivera@example.edu"]
# A course site that sends notifications with bulk headers
domains = ["lms.example.edu"]
keywords = ["assignment", "due", "deadline", "quiz", "exam", "syllabus"]

[skip]
senders = ["deals@shop.example.com"]
domains = ["news.example.org"]
keywords = ["newsletter", "webinar", "sale"]

[school]
# Mail likely to hold other students' personal information. Your own
# grades are fine to process, so grade keywords do not belong here.
sensitive_keywords = [
  "roster",
  "class list",
  "student list",
  "academic integrity",
]

[trust]
# Sender trust (ADR 0010). A deadline or to-do stays open only when its
# sender is trusted; any other goes to needs_review as untrusted_sender.
# A sender is trusted when its address or domain is on the [allow] lists
# above or on these lists, and Gmail authenticated that domain (a DMARC,
# DKIM or SPF pass recorded in Authentication-Results). Subject keywords
# never trust a sender, and nothing in the email body can.
#
# Your school domain, then recruiting, billing and rent platforms.
senders = []
domains = [
  "example.edu",
  "jobs.example.com",
  "careers.example.net",
  "assess.example.com",
  "power.example.com",
  "bank.example.com",
  "apartments.example.com",
]
# false trusts a listed domain without Gmail's authentication results.
# Leave it true: without it anyone can write a trusted From address.
require_auth = true

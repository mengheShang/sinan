name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端检查和测试
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sinan
          POSTGRES_PASSWORD: sinan
          POSTGRES_DB: sinan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sinan -d sinan"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sinan:sinan@127.0.0.1:5432/sinan
      TEST_DATABASE_URL: postgresql+psycopg://sinan:sinan@127.0.0.1:5432/sinan
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - name: 安装依赖
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff 格式
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: 禁用接口检查
        # 邮箱适配器不得调用发信、删信、移到垃圾箱或修改设置的 Gmail 接口
        run: |
          pattern='messages\(\)\s*\.\s*(send|delete|trash|batchDelete)|drafts\(\)\s*\.\s*send|\.settings\(\)'
          if grep -rnE "$pattern" --include='*.py' app apps; then
            echo "发现禁用的 Gmail 接口调用"
            exit 1
          fi
      - name: 数据库迁移
        run: uv run alembic upgrade head
      - name: pytest
        run: uv run pytest -q

  frontend:
    name: 前端检查和构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: 构建
        run: npm run build

  compose:
    name: 一键启动冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 启动全部服务
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: 检查健康接口
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/health/db
          curl -fsS http://127.0.0.1:3000 | grep -q "Sinan"
      - name: 输出日志
        if: failure()
        run: docker compose logs
      - name: 停止服务
        if: always()
        run: docker compose down -v

  secrets:
    name: 密钥扫描
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action 需要读取 PR 中的提交列表
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

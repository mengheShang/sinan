[project]
name = "sinan"
version = "0.1.0"
description = "AI 邮件行动系统：提取 DDL 和待办，经批准或授权后执行动作"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
# 这是应用而不是库，不需要打包安装
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: 需要 PostgreSQL，未设置 TEST_DATABASE_URL 时跳过",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Alembic 生成的文件头在没有上一版本时会留下行尾空格
"migrations/versions/**" = ["W291"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "apps", "tests", "migrations"]
exclude = ["apps/web/"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

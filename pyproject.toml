[project]
name = "sinan"
version = "0.1.0"
description = "AI email action system: extracts deadlines and to-dos, acts only after approval or a grant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "apscheduler>=3.10,<4",
    "cryptography>=44",
    "httpx>=0.28",
    "tzdata>=2025.1",
    "anthropic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.uv]
# This is an application, not a library, so it is not packaged
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs PostgreSQL; skipped when TEST_DATABASE_URL is not set",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts and obviously fake token strings
"tests/**" = ["S101", "S105", "S106"]
# Alembic leaves trailing whitespace in the header when there is no previous revision
"migrations/versions/**" = ["W291"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "apps", "evals", "tests", "migrations"]
exclude = ["apps/web/"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
